[build-system]
requires = [
    "setuptools>=61.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "netbox-pve-sync"
version = "0.2.4"
authors = [
    { name = "Aloïs Micard", email = "alois@micard.lu" },
]
description = "Synchronize Proxmox Virtual Environment (PVE) information to a NetBox instance"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "pynetbox>=7.4",
    "proxmoxer>=2.2",
    "psycopg[binary]>=3.2,<4",
    "pyvmomi>=8.0.3.0.1,<9",
    "requests>=2.32",
]

[project.urls]
Homepage = "https://github.com/CloseName/infra-sync"
Issues = "https://github.com/CloseName/infra-sync/issues"
Changelog = "https://github.com/CloseName/infra-sync/blob/main/Changelog.md"

[project.scripts]
nbpxsync = "netbox_pve_sync:main"

[tool.setuptools.packages.find]
include = ["netbox_pve_sync*"]

[license]
file = 'LICENSE.txt'
